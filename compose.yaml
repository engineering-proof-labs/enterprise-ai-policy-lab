services:
  app:
    build: .
    ports:
      - "127.0.0.1:${LAB_HTTP_PORT:-18080}:8080"
    environment:
      SERVER_ADDRESS: 0.0.0.0
      SPRING_DATASOURCE_URL: jdbc:postgresql://db:5432/policies
      LAB_OLLAMA_URL: http://ollama:11434
    depends_on:
      db:
        condition: service_healthy
      ollama:
        condition: service_healthy

  db:
    image: postgres:17.12-bookworm
    environment:
      POSTGRES_DB: policies
      POSTGRES_USER: policy_lab
      POSTGRES_PASSWORD: policy_lab
    healthcheck:
      test: ["CMD", "pg_isready", "-U", "policy_lab", "-d", "policies"]
      interval: 2s
      timeout: 3s
      retries: 15
    volumes:
      - policy-data:/var/lib/postgresql/data

  ollama:
    image: ollama/ollama:0.40.17
    healthcheck:
      test: ["CMD", "ollama", "list"]
      interval: 2s
      timeout: 3s
      retries: 15
    volumes:
      - model-data:/root/.ollama

volumes:
  policy-data:
  model-data:
